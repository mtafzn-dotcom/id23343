
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identidade Escolar - Simulação</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    background: white;
    overscroll-behavior: none;
}

.tela {
    position: relative;
    width: 100%;
    max-width: 739px;
    margin: auto;
    overflow: hidden;
}

.imagens {
    position: relative;
    width: 100%;
    overflow: hidden;
}

.imagens.identidade {
    touch-action: none;
}

.imagens img {
    display: block;
    width: 100%;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
}

#foto {
    position: relative;
    z-index: 1;
}

.foto-nova {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 2;
}

/* Próxima foto: tudo desliza para a direita */

@keyframes sairDireita {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
}

@keyframes entrarEsquerda {
    from { transform: translateX(-100%); }
    to { transform: translateX(0); }
}

/* Foto anterior: tudo desliza para a esquerda */

@keyframes sairEsquerda {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
}

@keyframes entrarDireita {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
}

.saindo-direita {
    animation: sairDireita 0.4s ease-in-out forwards;
}

.entrando-esquerda {
    animation: entrarEsquerda 0.4s ease-in-out forwards;
}

.saindo-esquerda {
    animation: sairEsquerda 0.4s ease-in-out forwards;
}

.entrando-direita {
    animation: entrarDireita 0.4s ease-in-out forwards;
}

/* Áreas clicáveis */

.botao {
    position: absolute;
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* Efeito cinza nos botões normais */

.botao::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(120, 120, 120, 0.35);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.botao.pressionado::after {
    opacity: 1;
}

/* Primeira tela */

.cliqueMenu {
    left: 7%;
    top: 51.5%;
    width: 86%;
    height: 5.5%;
}

/* Carteira de documentos */

.cliqueCarteira {
    left: 6%;
    top: 22%;
    width: 88%;
    height: 18%;
    display: none;
}

/* Setinha: clicável e sem efeito cinza */

.seta {
    position: absolute;
    right: 13%;
    bottom: 11%;
    width: 80px;
    height: 80px;
    display: none;
    z-index: 6;
    cursor: pointer;
    background: transparent;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* Botão X */

.fechar {
    top: 3%;
    right: 3%;
    width: 50px;
    height: 50px;
    display: none;
    z-index: 6;
}

.decorativo {
    display: none;
}
</style>
</head>

<body>

<div class="tela">

    <div class="imagens" id="imagens">
        <img
            id="foto"
            src="foto1.jpg"
            draggable="false"
            alt="Simulação escolar"
        >
    </div>

    <!-- Abre Carteira de Documentos -->
    <div
        class="botao cliqueMenu"
        onclick="abrirCarteira()"
    ></div>

    <!-- Abre identidade -->
    <div
        class="botao cliqueCarteira"
        onclick="abrirIdentidade()"
    ></div>

    <!-- Setinha: próxima foto -->
    <div
        class="seta"
        onclick="trocarFoto(1)"
    ></div>

    <!-- X: volta à primeira tela -->
    <div
        class="botao fechar"
        onclick="fecharIdentidade()"
    ></div>

    <!-- Botões decorativos -->

    <div
        class="botao decorativo"
        data-tela="inicio"
        style="top:42%;left:5%;width:90%;height:5%;"
    ></div>

    <div
        class="botao decorativo"
        data-tela="inicio"
        style="top:58%;left:5%;width:90%;height:5%;"
    ></div>

    <div
        class="botao decorativo"
        data-tela="inicio"
        style="top:64%;left:5%;width:90%;height:5%;"
    ></div>

    <div
        class="botao decorativo"
        data-tela="inicio"
        style="top:70%;left:5%;width:90%;height:5%;"
    ></div>

    <div
        class="botao decorativo"
        data-tela="inicio"
        style="top:76%;left:5%;width:90%;height:5%;"
    ></div>

</div>

<script>
/* As quatro fotos da identidade */

const fotos = [
    "foto3a.jpg",
    "foto3b.jpg",
    "foto3c.jpg",
    "foto3d.jpg"
];

let atual = 0;
let identidadeAberta = false;
let animando = false;

let inicioY = 0;
let inicioX = 0;
let toqueIniciado = false;

const foto = document.getElementById("foto");
const imagens = document.getElementById("imagens");

const menu = document.querySelector(".cliqueMenu");
const carteira = document.querySelector(".cliqueCarteira");
const seta = document.querySelector(".seta");
const fechar = document.querySelector(".fechar");

const decorativos =
    document.querySelectorAll(".decorativo");

/* Pré-carrega as fotos */

fotos.forEach(src => {
    const imagem = new Image();
    imagem.src = src;
});

/* Mostra os botões de cada tela */

function atualizarDecorativos(tela) {
    decorativos.forEach(botao => {
        botao.style.display =
            botao.dataset.tela === tela
                ? "block"
                : "none";
    });
}

/* Abre Carteira de Documentos */

function abrirCarteira() {
    if (animando) return;

    identidadeAberta = false;
    imagens.classList.remove("identidade");

    foto.src = "foto2.jpg";

    menu.style.display = "none";
    carteira.style.display = "block";
    seta.style.display = "none";
    fechar.style.display = "none";

    atualizarDecorativos("carteira");
}

/* Abre identidade */

function abrirIdentidade() {
    if (animando) return;

    atual = 0;
    identidadeAberta = true;

    foto.src = fotos[atual];
    imagens.classList.add("identidade");

    menu.style.display = "none";
    carteira.style.display = "none";
    seta.style.display = "block";
    fechar.style.display = "block";

    atualizarDecorativos("identidade");
}

/* Troca as fotos com animação horizontal */

function trocarFoto(direcao) {
    if (!identidadeAberta || animando) return;

    const proxima =
        (atual + direcao + fotos.length)
        % fotos.length;

    animando = true;

    const nova = document.createElement("img");

    nova.src = fotos[proxima];
    nova.className = "foto-nova";
    nova.draggable = false;

    imagens.appendChild(nova);

    if (direcao === 1) {

        /*
         * Próxima foto:
         * a atual sai pela DIREITA;
         * a próxima entra pela ESQUERDA.
         */

        foto.classList.add("saindo-direita");
        nova.classList.add("entrando-esquerda");

    } else {

        /*
         * Foto anterior:
         * a atual sai pela ESQUERDA;
         * a anterior entra pela DIREITA.
         */

        foto.classList.add("saindo-esquerda");
        nova.classList.add("entrando-direita");
    }

    nova.addEventListener("animationend", () => {

        atual = proxima;
        foto.src = fotos[atual];

        foto.classList.remove(
            "saindo-direita",
            "saindo-esquerda"
        );

        nova.remove();

        animando = false;

    }, { once: true });
}

/* Detecta quando o dedo encosta */

imagens.addEventListener("touchstart", e => {

    if (!identidadeAberta || animando) return;
    if (e.touches.length !== 1) return;

    inicioY = e.touches[0].clientY;
    inicioX = e.touches[0].clientX;

    toqueIniciado = true;

}, { passive: true });

/* Impede que o celular role a página durante o gesto */

imagens.addEventListener("touchmove", e => {

    if (!identidadeAberta || !toqueIniciado) return;

    const movimentoY =
        e.touches[0].clientY - inicioY;

    const movimentoX =
        e.touches[0].clientX - inicioX;

    if (
        Math.abs(movimentoY) >
        Math.abs(movimentoX)
    ) {
        e.preventDefault();
    }

}, { passive: false });

/* Ao soltar o dedo, troca a foto */

imagens.addEventListener("touchend", e => {

    if (!identidadeAberta ||
        animando ||
        !toqueIniciado) return;

    toqueIniciado = false;

    const fimY =
        e.changedTouches[0].clientY;

    const fimX =
        e.changedTouches[0].clientX;

    const movimentoY = fimY - inicioY;
    const movimentoX = fimX - inicioX;

    /* Ignora gestos muito pequenos */

    if (Math.abs(movimentoY) < 50) return;

    /* Ignora movimentos predominantemente horizontais */

    if (
        Math.abs(movimentoX) >
        Math.abs(movimentoY)
    ) return;

    if (movimentoY < 0) {

        /* Arrastou para cima:
           foto desliza para a DIREITA */

        trocarFoto(1);

    } else {

        /* Arrastou para baixo:
           foto desliza para a ESQUERDA */

        trocarFoto(-1);
    }

}, { passive: true });

imagens.addEventListener("touchcancel", () => {
    toqueIniciado = false;
});

/* X volta diretamente à primeira tela */

function fecharIdentidade() {
    if (animando) return;

    atual = 0;
    identidadeAberta = false;
    toqueIniciado = false;

    imagens.classList.remove("identidade");

    foto.src = "foto1.jpg";

    menu.style.display = "block";
    carteira.style.display = "none";
    seta.style.display = "none";
    fechar.style.display = "none";

    atualizarDecorativos("inicio");
}

/* Efeito cinza apenas nos outros botões */

document.querySelectorAll(".botao").forEach(botao => {

    botao.addEventListener("pointerdown", () => {
        botao.classList.add("pressionado");
    });

    botao.addEventListener("pointerup", () => {
        setTimeout(() => {
            botao.classList.remove("pressionado");
        }, 150);
    });

    ["pointercancel", "pointerleave"].forEach(evento => {

        botao.addEventListener(evento, () => {
            botao.classList.remove("pressionado");
        });

    });
});

/* Inicia na primeira tela */

atualizarDecorativos("inicio");

/* Impede arrastar as imagens como arquivos */

document.addEventListener("dragstart", e => {
    e.preventDefault();
});
</script>

</body>
</html>
