
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Menu</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    background: white;
    overscroll-behavior: none;
}

.tela {
    position: relative;
    width: 100%;
    max-width: 739px;
    margin: auto;
    overflow: hidden;
}

.imagens {
    position: relative;
    width: 100%;
    overflow: hidden;
}

.imagens.identidade {
    touch-action: none;
}

.imagens img {
    display: block;
    width: 100%;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
}

.foto-nova {
    position: absolute;
    inset: 0;
    height: 100%;
    object-fit: fill;
    z-index: 2;
}

/* Animação horizontal */

@keyframes sairDireita {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
}

@keyframes entrarEsquerda {
    from { transform: translateX(-100%); }
    to { transform: translateX(0); }
}

@keyframes sairEsquerda {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
}

@keyframes entrarDireita {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
}

.saindo-direita {
    animation: sairDireita 0.4s ease-in-out forwards;
}

.entrando-esquerda {
    animation: entrarEsquerda 0.4s ease-in-out forwards;
}

.saindo-esquerda {
    animation: sairEsquerda 0.4s ease-in-out forwards;
}

.entrando-direita {
    animation: entrarDireita 0.4s ease-in-out forwards;
}

/* Botões */

.botao {
    position: absolute;
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* Efeito cinza */

.botao::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(120,120,120,0.35);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.botao.pressionado::after {
    opacity: 1;
}

/* Primeira tela */

.cliqueMenu {
    left: 7%;
    top: 51.5%;
    width: 86%;
    height: 5.5%;
}

/* Carteira */

.cliqueCarteira {
    left: 6%;
    top: 22%;
    width: 88%;
    height: 18%;
    display: none;
}

/* Setinha sem efeito cinza */

.seta {
    position: absolute;
    right: 13%;
    bottom: 11%;
    width: 80px;
    height: 80px;
    display: none;
    z-index: 6;
    cursor: pointer;
    background: transparent;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* X */

.fechar {
    top: 3%;
    right: 3%;
    width: 50px;
    height: 50px;
    display: none;
    z-index: 6;
}

.decorativo {
    display: none;
}
</style>
</head>

<body>

<div class="tela">

    <div class="imagens" id="imagens">
        <img id="foto"
             src="foto1.jpg"
             draggable="false"
             alt="Simulação escolar">
    </div>

    <div class="botao cliqueMenu"
         onclick="abrirCarteira()"></div>

    <div class="botao cliqueCarteira"
         onclick="abrirIdentidade()"></div>

    <div class="seta"
         onclick="trocarFoto(1)"></div>

    <div class="botao fechar"
         onclick="fecharIdentidade()"></div>

    <!-- Botões decorativos -->

    <div class="botao decorativo"
         data-tela="inicio"
         style="top:42%;left:5%;width:90%;height:5%;">
    </div>

    <div class="botao decorativo"
         data-tela="inicio"
         style="top:58%;left:5%;width:90%;height:5%;">
    </div>

    <div class="botao decorativo"
         data-tela="inicio"
         style="top:64%;left:5%;width:90%;height:5%;">
    </div>

    <div class="botao decorativo"
         data-tela="inicio"
         style="top:70%;left:5%;width:90%;height:5%;">
    </div>

    <div class="botao decorativo"
         data-tela="inicio"
         style="top:76%;left:5%;width:90%;height:5%;">
    </div>

</div>

<script>
const fotos = [
    "foto3a.jpg",
    "foto3b.jpg",
    "foto3c.jpg",
    "foto3d.jpg"
];

let atual = 0;
let identidadeAberta = false;
let animando = false;

let inicioY = 0;
let inicioX = 0;

const foto = document.getElementById("foto");
const imagens = document.getElementById("imagens");

const menu = document.querySelector(".cliqueMenu");
const carteira = document.querySelector(".cliqueCarteira");
const seta = document.querySelector(".seta");
const fechar = document.querySelector(".fechar");

const decorativos =
    document.querySelectorAll(".decorativo");

/* Botões decorativos */

function atualizarDecorativos(tela) {
    decorativos.forEach(botao => {
        botao.style.display =
            botao.dataset.tela === tela
            ? "block" : "none";
    });
}

/* Abre Carteira */

function abrirCarteira() {
    identidadeAberta = false;
    imagens.classList.remove("identidade");

    foto.src = "foto2.jpg";

    menu.style.display = "none";
    carteira.style.display = "block";
    seta.style.display = "none";
    fechar.style.display = "none";

    atualizarDecorativos("carteira");
}

/* Abre identidade */

function abrirIdentidade() {
    atual = 0;
    identidadeAberta = true;

    foto.src = fotos[atual];
    imagens.classList.add("identidade");

    menu.style.display = "none";
    carteira.style.display = "none";
    seta.style.display = "block";
    fechar.style.display = "block";

    atualizarDecorativos("identidade");
}

/* Troca de foto horizontal */

function trocarFoto(direcao) {

    if (!identidadeAberta || animando) return;

    const proxima =
        (atual + direcao + fotos.length) % fotos.length;

    animando = true;

    const nova = document.createElement("img");

    nova.src = fotos[proxima];
    nova.className = "foto-nova";
    nova.draggable = false;

    imagens.appendChild(nova);

    if (direcao === 1) {
        foto.classList.add("saindo-direita");
        nova.classList.add("entrando-esquerda");
    } else {
        foto.classList.add("saindo-esquerda");
        nova.classList.add("entrando-direita");
    }

    nova.addEventListener("animationend", () => {
        atual = proxima;
        foto.src = fotos[atual];

        foto.classList.remove(
            "saindo-direita",
            "saindo-esquerda"
        );

        nova.remove();
        animando = false;

    }, { once: true });
}

/* Gesto de arrastar para cima ou baixo */

imagens.addEventListener("touchstart", e => {

    if (!identidadeAberta || animando) return;

    inicioY = e.touches[0].clientY;
    inicioX = e.touches[0].clientX;

}, { passive: true });

imagens.addEventListener("touchend", e => {

    if (!identidadeAberta || animando) return;

    const fimY = e.changedTouches[0].clientY;
    const fimX = e.changedTouches[0].clientX;

    const movimentoY = fimY - inicioY;
    const movimentoX = fimX - inicioX;

    if (Math.abs(movimentoY) < 50) return;

    if (Math.abs(movimentoX) >
        Math.abs(movimentoY)) return;

    if (movimentoY < 0) {
        trocarFoto(1);
    } else {
        trocarFoto(-1);
    }

}, { passive: true });

/* X volta à primeira tela */

function fecharIdentidade() {
    if (animando) return;

    atual = 0;
    identidadeAberta = false;

    imagens.classList.remove("identidade");

    foto.src = "foto1.jpg";

    menu.style.display = "block";
    carteira.style.display = "none";
    seta.style.display = "none";
    fechar.style.display = "none";

    atualizarDecorativos("inicio");
}

/* Efeito cinza nos outros botões */

document.querySelectorAll(".botao").forEach(botao => {

    botao.addEventListener("pointerdown", () => {
        botao.classList.add("pressionado");
    });

    botao.addEventListener("pointerup", () => {
        setTimeout(() => {
            botao.classList.remove("pressionado");
        }, 150);
    });

    ["pointercancel", "pointerleave"].forEach(evento => {
        botao.addEventListener(evento, () => {
            botao.classList.remove("pressionado");
        });
    });
});

atualizarDecorativos("inicio");

document.addEventListener("dragstart", e => {
    e.preventDefault();
});
</script>

</body>
</html>
