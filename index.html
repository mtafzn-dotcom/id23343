function home(){document.getElementById('demo').style.display='none';document.getElementById('photos').style.display='block';document.getElementById('shot').src=homeImg;document.getElementById('homeTap').style.display='block';document.getElementById('walletTap').style.display='none';document.getElementById('backTap').style.display='none'}

function slide(delta,reset=false){n=reset?0:(n+delta+4)%4;let a=slides[n];document.getElementById('fakefields').innerHTML='<small>Nome / Tela</small><b>'+a[0]+'</b><small>Categoria</small><strong>'+a[1]+'</strong><small>Descrição</small><strong>'+a[2]+'</strong>';document.getElementById('dots').innerHTML=slides.map((_,i)=>'<button class="dot '+(i===n?'active':'')+'" aria-label="Imagem '+(i+1)+'" onclick="slide('+(i-n)+')"></button>').join('')}
